services:
  postgres:
    image: postgres:18
    container_name: phong_kham_db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # Chỉ mở trên máy local, không lộ ra mạng ngoài
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18+ lưu dữ liệu dưới /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Giao diện web quản trị PostgreSQL — http://localhost:5050
  # Đăng nhập bằng PGADMIN_EMAIL / PGADMIN_PASSWORD trong .env
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: phong_kham_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Khai báo sẵn server "Local Postgres (Docker)" (chỉ nạp ở lần chạy đầu)
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
